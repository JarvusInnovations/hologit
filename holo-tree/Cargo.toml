[package]
name = "holo-tree"
version = "0.1.0"
edition = "2021"
description = "Mutable in-memory git trees — read, merge, write via gix"
license = "MIT"

[dependencies]
# Tree/object manipulation only — no networking, so gix defaults suffice
# (drops the TLS/OpenSSL pull-in of `blocking-network-client`, easing
# cross-compilation for the holo-tree-napi binding).
gix = { version = "0.83" }
globset = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
