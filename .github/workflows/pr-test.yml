name: 'PR: Test'

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Configure git identity
        run: |
          git config --global user.name "Github Action Test"
          git config --global user.email "test@test.com"

      - run: npm install

      - name: Run tests
        run: npm test

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  test-cli:

    runs-on: ubuntu-latest
    steps:

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Configure git identity
        run: |
          git config user.name "Github Action $GITHUB_JOB"
          git config user.email "$(whoami)@$(uname -n)"

      - run: npm install

      - name: Build Rust projector addon
        run: npm run build:projector-addon

      - name: Test holo-projector-napi binding
        run: npm --prefix holo-projector-napi test

      # Each projection runs under both engines (specs/behaviors/engine-selection.md):
      # HOLO_ENGINE=rust errors loudly instead of falling back, so a passing
      # rust run proves the Rust composition path actually executed — and the
      # hash comparison is the determinism gate between the engines.
      - name: 'Test projection: github-action-projector (JS vs Rust engine)'
        run: |
          set -euo pipefail
          js_hash=$(HOLO_ENGINE=js node bin/cli.js project --no-cache-from --cache-to=origin github-action-projector | tail -1)
          rust_hash=$(HOLO_ENGINE=rust node bin/cli.js project --no-cache-from --cache-to=origin github-action-projector | tail -1)
          echo "js:   ${js_hash}"
          echo "rust: ${rust_hash}"
          test "${js_hash}" = "${rust_hash}"

      - name: 'Test projection: docs-site (JS vs Rust engine)'
        run: |
          set -euo pipefail
          js_hash=$(HOLO_ENGINE=js node bin/cli.js project --no-cache-from --cache-to=origin docs-site | tail -1)
          rust_hash=$(HOLO_ENGINE=rust node bin/cli.js project --no-cache-from --cache-to=origin docs-site | tail -1)
          echo "js:   ${js_hash}"
          echo "rust: ${rust_hash}"
          test "${js_hash}" = "${rust_hash}"

      # Commit parity (specs/behaviors/projection-commits.md +
      # specs/behaviors/engine-selection.md § Commit dispatch): under pinned
      # identity, both engines must produce byte-identical projection commits
      # — HOLO_ENGINE=rust routes the commit through the binding's
      # commitProjection, so equal commit hashes prove the Rust commit path
      # ran and matches the JS oracle byte-for-byte.
      - name: 'Test projection commit: docs-site --commit-to (JS vs Rust engine, pinned identity)'
        env:
          GIT_AUTHOR_NAME: 'Holo Author'
          GIT_AUTHOR_EMAIL: 'author@example.com'
          GIT_AUTHOR_DATE: '1700000000 +0000'
          GIT_COMMITTER_NAME: 'Holo Committer'
          GIT_COMMITTER_EMAIL: 'committer@example.com'
          GIT_COMMITTER_DATE: '1700000001 +0000'
        run: |
          set -euo pipefail
          js_commit=$(HOLO_ENGINE=js node bin/cli.js project --no-cache-from --no-lens --commit-to=refs/holo-ci/js docs-site | tail -1)
          rust_commit=$(HOLO_ENGINE=rust node bin/cli.js project --no-cache-from --no-lens --commit-to=refs/holo-ci/rust docs-site | tail -1)
          echo "js:   ${js_commit}"
          echo "rust: ${rust_commit}"
          test "${js_commit}" = "${rust_commit}"
          test "$(git rev-parse refs/holo-ci/js)" = "$(git rev-parse refs/holo-ci/rust)"

  test-action:

    runs-on: ubuntu-latest
    steps:

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/checkout@v4

      - run: npm install
        working-directory: github-actions/projector

      - name: Install local hologit
        run: |
          npm install
          npm link

      - name: 'Test projection action: github-action-projector'
        uses: ./github-actions/projector/
        with:
          holobranch: github-action-projector
          cache: false

      - name: 'Test projection action: docs-site'
        uses: ./github-actions/projector/
        with:
          holobranch: docs-site
          cache: false
